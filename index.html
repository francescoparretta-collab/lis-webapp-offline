<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LIS Riconoscimento</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0a14">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    color: #eee;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body { display: flex; justify-content: center; }
  #stage {
    position: relative;
    width: 100%;
    max-width: 480px; /* su PC simula la larghezza di un telefono; su telefono vero non ha effetto */
    height: 100vh;
    background: #0a0a14;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  #ui {
    flex: 0 0 auto;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #10101c;
    border-bottom: 1px solid #1c1c2c;
    z-index: 10;
  }
  #titolo { font-size: 15px; font-weight: 600; color: #00e0ff; letter-spacing: 0.5px; }
  #stato, #offline-badge { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.08); }
  #stato.ok, #offline-badge.ok { color: #7fe08a; }
  #stato.wait, #offline-badge.wait { color: #ffcc66; }
  #stato.err, #offline-badge.err { color: #ff6b6b; }

  /* Chat */
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 14px 100px; /* spazio per la camera PiP che galleggia sopra */
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    align-self: flex-end;
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px 16px 4px 16px;
    background: #00b8d4;
    color: #00232a;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.35;
    word-wrap: break-word;
  }
  .bubble.pending { background: #1c3a40; color: #7fd8e8; border: 1px dashed #2a5a63; font-weight: 500; }
  .bubble.operatore {
    align-self: flex-start;
    background: #24242e;
    color: #eee;
    border-radius: 16px 16px 16px 4px;
    font-weight: 500;
  }

  /* Camera piccola (PiP), come una videochiamata — trascinabile su/giu' */
  #pip {
    position: absolute;
    top: 60px; right: 12px;
    width: 100px; height: 133px;
    border-radius: 14px;
    overflow: hidden;
    border: 1.5px solid #2a2a3a;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    z-index: 15;
    background: #000;
    touch-action: none; /* il trascinamento verticale lo gestisce JS, non lo scroll del browser */
    cursor: grab;
  }
  #pip.trascinando { cursor: grabbing; box-shadow: 0 6px 20px rgba(0,0,0,0.7); }
  #pip video, #pip canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }
  #pip video { visibility: hidden; }
  /* Lo specchio (mirror) viene "cotto" nei pixel del canvas in app.js,
     esattamente come cv2.flip(frame,1) nel PC — cosi' la classificazione
     mano sinistra/destra di MediaPipe combacia tra browser e Python. */

  /* Barra input in basso */
  #input-bar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: #10101c;
    border-top: 1px solid #1c1c2c;
    z-index: 10;
  }
  #msg-input {
    flex: 1;
    background: #1a1a28;
    border: 1px solid #2a2a3a;
    border-radius: 20px;
    padding: 9px 16px;
    color: #eee;
    font-size: 15px;
  }
  #msg-input::placeholder { color: #666; }
  #btn-pulisci, #btn-invia, #btn-mic {
    background: #1a1a28;
    border: 1px solid #2a2a3a;
    border-radius: 20px;
    padding: 9px 14px;
    color: #ccc;
    font-size: 13px;
  }
  #btn-invia { background: #00b8d4; color: #00232a; font-weight: 600; border-color: #00b8d4; }
  #btn-mic.attivo { background: #ff5050; color: #fff; border-color: #ff5050; }
  #btn-mic[hidden] { display: none; }

  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #0a0a14;
    z-index: 20;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="ui">
    <div id="titolo">LIS</div>
    <div style="display:flex; align-items:center; gap:6px;">
      <div id="offline-badge" class="wait">scarico offline...</div>
      <div id="stato" class="wait">avvio...</div>
    </div>
  </div>

  <div id="chat"></div>

  <div id="pip">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="input-bar">
    <button id="btn-mic" type="button" hidden>Mic</button>
    <input id="msg-input" type="text" placeholder="Messaggio operatore..." />
    <button id="btn-invia" type="button">Invia</button>
    <button id="btn-pulisci" type="button">Pulisci</button>
  </div>

  <div id="loading">
    <div>Caricamento modelli MediaPipe...</div>
  </div>
</div>
<script src="vendor/tfjs/tf.min.js"></script>
<script src="vendor/vosk/vosk.js"></script>
<script type="module" src="app.js"></script>
<script>
  // Versione OFFLINE: il service worker mette in cache tutto (librerie,
  // modelli, pagina) al primo avvio, cosi' dopo funziona senza internet.
  // TOTALE_FILE deve combaciare con la lunghezza di FILE_ASSETS in sw.js.
  const TOTALE_FILE = 24;
  const badge = document.getElementById('offline-badge');

  async function controllaCacheOffline() {
    try {
      // Cerca tra le cache 'lis-offline-vN' (qualunque N) quella con PIU'
      // file, non la prima che trova: se resta una cache vuota di una
      // versione vecchia (es. una pulizia mancata), non deve ingannare
      // il conteggio. Cosi' il badge non si disallinea piu' da sw.js
      // ogni volta che CACHE viene incrementata li'.
      const nomi = (await caches.keys()).filter(n => n.startsWith('lis-offline-'));
      let chiavi = [];
      for (const nome of nomi) {
        const c = await caches.open(nome);
        const k = await c.keys();
        if (k.length > chiavi.length) chiavi = k;
      }
      if (chiavi.length >= TOTALE_FILE) {
        badge.textContent = 'pronto per offline';
        badge.className = 'ok';
        return true;
      }
      badge.textContent = `scarico offline... ${chiavi.length}/${TOTALE_FILE}`;
      badge.className = 'wait';
      return false;
    } catch {
      return false;
    }
  }

  async function diagnosticaCacheOffline() {
    // Prova a scaricare ogni file uno per uno DIRETTAMENTE dalla pagina
    // (bypassando il service worker) per trovare quale fallisce e perche' --
    // caches.addAll() nel service worker e' tutto-o-niente: se UN file
    // fallisce, l'intera cache resta vuota per sempre, senza dire quale.
    try {
      const swText = await (await fetch('sw.js')).text();
      const match = swText.match(/FILE_ASSETS\s*=\s*\[([\s\S]*?)\];/);
      if (!match) { badge.textContent = 'diagnostica: non leggo sw.js'; return; }
      const file = [...match[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
      const risultati = [];
      for (const f of file) {
        try {
          const r = await fetch(f, { cache: 'no-store' });
          risultati.push(`${r.ok ? 'OK' : 'ERRORE ' + r.status} ${f}`);
        } catch (e) {
          risultati.push(`FALLITO (${e.message}) ${f}`);
        }
      }
      const falliti = risultati.filter(r => !r.startsWith('OK'));
      badge.textContent = falliti.length
        ? `${falliti.length} file falliti -- vedi sotto`
        : 'tutti i file OK singolarmente, ma addAll() fallisce comunque';
      badge.className = 'err';
      const box = document.createElement('div');
      box.style.cssText = 'position:fixed;top:40px;left:8px;right:8px;background:#000;color:#0f0;' +
        'font-size:11px;font-family:monospace;padding:8px;z-index:999;max-height:60vh;overflow:auto;white-space:pre-wrap;';
      box.textContent = risultati.join('\n');
      document.body.appendChild(box);
    } catch (e) {
      badge.textContent = 'diagnostica fallita: ' + e.message;
    }
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch((e) => {
      badge.textContent = 'Errore registrazione SW: ' + e.message;
      badge.className = 'err';
    });
    let tentativi = 0;
    const intervallo = setInterval(async () => {
      tentativi++;
      if (await controllaCacheOffline()) { clearInterval(intervallo); return; }
      if (tentativi === 20) { // ~20s senza successo -> diagnostica
        clearInterval(intervallo);
        diagnosticaCacheOffline();
      }
    }, 1000);
  } else {
    badge.textContent = 'offline non supportato';
    badge.className = 'err';
  }
</script>
</body>
</html>
